<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f7fb;
      padding:40px;
      text-align:center;
    }

    h2{
      margin-bottom:20px;
      color:#333;
    }

    table{
      margin:auto;
      border-collapse:collapse;
      width:70%;
      background:white;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    th, td{
      border:1px solid #ccc;
      padding:15px;
      text-align:center;
    }

    th{
      background:#4a90e2;
      color:white;
    }

    tr:hover{
      background:#f1f1f1;
    }

    button{
      margin-top:20px;
      padding:12px 20px;
      border:none;
      background:#ff6b6b;
      color:white;
      border-radius:10px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#e55050;
    }
  </style>
</head>

<body>

  <h2>Computer Parts Price List &copy; &trade; &bull;</h2>

  <table id="partsTable">

    <tr>
      <th>Computer Part</th>
      <th>Price</th>
    </tr>

    <tr>
      <td>CPU Intel i5</td>
      <td>$250</td>
    </tr>

    <tr>
      <td>RTX 4060</td>
      <td>$450</td>
    </tr>

    <tr>
      <td>16GB RAM</td>
      <td>$80</td>
    </tr>

    <tr>
      <td>SSD 1TB</td>
      <td>$120</td>
    </tr>

  </table>

  <button onclick="changeColor()">
    Change Color
  </button>

  <script>

    function changeColor(){

      const table = document.getElementById("partsTable");

      table.style.color = "red";

    }

  </script>

</body>
</html>
