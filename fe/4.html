<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 40px;
    }

    h1{
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .menu-container{
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .menu-section{
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .menu-section h2{
      margin-bottom: 15px;
      color: #4a90e2;
    }

    .item{
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: #f2f2f2;
    }

    .price{
      float: right;
      font-weight: bold;
      color: #ff6b6b;
    }

    button{
      display: block;
      margin: 0 auto 30px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #4a90e2;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      background: #357bd8;
    }
  </style>
</head>

<body>

  <h1>Restaurant Menu &reg; &dollar; &ge;</h1>

  <button onclick="filterMenu()">
    Filter Vegetarian Menu
  </button>

  <div class="menu-container">

    <!-- Appetizers -->
    <div class="menu-section">
      <h2>Appetizers</h2>

      <div class="item vegetarian">
        Salad <span class="price">$5</span>
      </div>

      <div class="item">
        Chicken Wings <span class="price">$8</span>
      </div>
    </div>

    <!-- Main Course -->
    <div class="menu-section">
      <h2>Main Course</h2>

      <div class="item vegetarian">
        Vegetable Pasta <span class="price">$12</span>
      </div>

      <div class="item">
        Beef Steak <span class="price">$18</span>
      </div>
    </div>

    <!-- Desserts -->
    <div class="menu-section">
      <h2>Desserts</h2>

      <div class="item vegetarian">
        Ice Cream <span class="price">$6</span>
      </div>

      <div class="item">
        Chocolate Cake <span class="price">$7</span>
      </div>
    </div>

    <!-- Drinks -->
    <div class="menu-section">
      <h2>Drinks</h2>

      <div class="item vegetarian">
        Orange Juice <span class="price">$4</span>
      </div>

      <div class="item">
        Milk Tea <span class="price">$5</span>
      </div>
    </div>

  </div>

  <script>

    let showVegetarian = false;

    function filterMenu(){

      // Get all menu items
      let items = document.getElementsByClassName("item");

      showVegetarian = !showVegetarian;

      for(let i = 0; i < items.length; i++){

        // Check if item has vegetarian class
        if(showVegetarian){

          if(!items[i].classList.contains("vegetarian")){
            items[i].style.display = "none";
          }

        } else {
          items[i].style.display = "block";

        }
      }
    }
  </script>
</body>
</html>
