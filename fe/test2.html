<!DOCTYPE html>
<!-- Khai báo loại tài liệu HTML5 -->
<html lang="en">
<!-- Phần đầu của trang, chứa metadata và styling -->
<head>
    <!-- Khai báo bộ ký tự UTF-8 -->
    <meta charset="UTF-8">
    <!-- Thiết lập responsive cho các thiết bị mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tiêu đề trang hiển thị trên tab trình duyệt -->
    <title>Test Page</title>
    <!-- Định nghĩa các kiểu CSS -->
    <style>
        body {
            font-family: Arial, sans-serif; /* Font chữ Arial hoặc sans-serif */
            margin: 0; /* Loại bỏ khoảng cách ngoài */
            padding: 20px; /* Thêm khoảng cách trong 20px */
        }
    </style>
</head>
<!-- Nội dung chính của trang -->
<body>
    <h1>Welcome</h1> <!-- Tiêu đề cấp 1 -->
    <p>This is a test page.</p> <!-- Đoạn văn bản -->
</body>
